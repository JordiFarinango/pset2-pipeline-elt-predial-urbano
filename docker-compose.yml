name: pset2-cayambe

x-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-kestra}"
      POSTGRES_USER: "${POSTGRES_USER:-kestra}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en tu archivo .env local}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *local-logging

  kestra:
    image: kestra/kestra:v2.0.9
    env_file:
      - .env.kestra.secrets
    restart: unless-stopped
    user: "1000:1000"
    command: ["server", "standalone", "--config", "/etc/kestra/application.yaml"]
    stop_grace_period: 6m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-kestra}"
      POSTGRES_USER: "${POSTGRES_USER:-kestra}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en tu archivo .env local}"
      KESTRA_ADMIN_EMAIL: "${KESTRA_ADMIN_EMAIL:?Completa KESTRA_ADMIN_EMAIL en tu archivo .env local}"
      KESTRA_ADMIN_PASSWORD: "${KESTRA_ADMIN_PASSWORD:?Completa KESTRA_ADMIN_PASSWORD en tu archivo .env local}"
      KESTRA_PUBLIC_URL: "http://127.0.0.1:${KESTRA_HTTP_PORT:-8080}/"
    ports:
      - "127.0.0.1:${KESTRA_HTTP_PORT:-8080}:8080"
    volumes:
      - ./kestra/application.yaml:/etc/kestra/application.yaml:ro
      # El directorio home existe en la imagen y pertenece a UID/GID 1000.
      # El volumen hereda esa propiedad sin un contenedor inicializador root.
      - kestra_data:/home/kestra
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-logging

  spark:
    image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
    restart: unless-stopped
    init: true
    user: "185:185"
    working_dir: /tmp
    # Entorno de ejecucion local preparado; no inicia JVM ni ejecuta jobs.
    entrypoint: ["/bin/bash", "-lc"]
    command: ["exec sleep infinity"]
    environment:
      HOME: /tmp
      SPARK_CONF_DIR: /opt/spark/conf
      SPARK_LOCAL_DIRS: /tmp/spark-local
      PYSPARK_PYTHON: python3
    volumes:
      - ./spark:/workspace/spark:ro
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-logging

volumes:
  postgres_data:
  kestra_data:
