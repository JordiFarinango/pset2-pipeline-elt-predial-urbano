version: 2
models:
  - name: br_lote_confirmado
    description: "Una fila del ledger para el UUID confirmado; sin fallback."
    columns:
      - name: lote_id
        description: "UUID de la captura confirmada seleccionada. No mezclar lotes para sumar obligaciones o movimientos. Origen: LOTE_ID."
        data_tests:
          - not_null
          - unique
      - name: fiscal_desde
        description: "Atributo fiscal_desde del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: fiscal_hasta
        description: "Atributo fiscal_hasta del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: limite
        description: "Atributo limite del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: capturado_en
        description: "Inicio de captura UTC del ejecutor; no es emision efectiva ni tiempo historico del estado. Origen: CAPTURADO_EN."
        data_tests:
          - not_null
      - name: id_version
        description: "Version del identificador HMAC protegido; no incluye su secreto. Origen: ID_VERSION."
        data_tests:
          - not_null
      - name: contrato_version
        description: "Atributo contrato_version del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: obligaciones
        description: "Atributo obligaciones del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: movimientos
        description: "Atributo movimientos del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
      - name: commit_en
        description: "Atributo commit_en del lote seleccionado; conservar trazabilidad sin reinterpretar codigos."
  - name: br_obligaciones
    description: "Proyeccion explicita Raw de obligaciones del lote seleccionado, con nombres normalizados sin alterar valores."
    columns:
      - name: obligacion_id
        description: "HMAC estable de la PK completa. Identificador seudonimizado; no es anonimizacion. Origen: OBLIGACION_ID."
        data_tests:
          - not_null
          - unique
      - name: anio_fiscal
        description: "Anio derivado de AVA_FECHA en el extractor; no sustituye fecha efectiva de emision. Origen: ANIO_FISCAL."
      - name: importe_principal
        description: "Origen IM_PRINCIPAL, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_solares
        description: "Origen IM_SOLARES, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_medicina
        description: "Origen IM_MEDICINA, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_educacion
        description: "Origen IM_EDUCACION, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_magisterio
        description: "Origen IM_MAGISTERIO, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_vivienda
        description: "Origen IM_VIVIENDA, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_bomberos
        description: "Origen IM_BOMBEROS, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_escolares
        description: "Origen IM_ESCOLARES, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_procesamiento
        description: "Origen IM_PROCESAMIENTO, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_basura
        description: "Origen IM_BASURA, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos. Su nombre no acredita una tasa de basura."
      - name: importe_bordillo
        description: "Origen IM_BORDILLO, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_alcanta
        description: "Origen IM_ALCANTA, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_adoqui_nuevo
        description: "Origen IM_ADOQUI_NUEVO, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos."
      - name: importe_ado_glob_2011
        description: "Origen IM_ADO_GLOB_2011, componente monetario declarado NUMBER(16,2), sin modificar signo o nulos. Semantica completa pendiente."
      - name: total_obligacion_declarado
        description: "IM_TOTAL observado en la captura actual. No acredita total originalmente emitido ni saldo historico. Origen: IM_TOTAL."
      - name: fecha_emision_declarada
        description: "Origen IM_FECHA_EMISION, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_creacion_declarada
        description: "Origen IM_FECHA_CREA, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_modificacion_declarada
        description: "Origen IM_FECHA_ULTMODIFIC, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_pago_actual_declarada
        description: "Origen IM_FECHA_PAGO, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_anulacion_declarada
        description: "Origen IM_FECHA_ANULACION, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: estado_codigo
        description: "Codigo literal actual. No se convierte automaticamente en pagado, pendiente o etiqueta predictiva. Origen: IM_ESTADO."
      - name: condicion_codigo
        description: "Codigo literal sin catalogo universal validado; conservar nulos y valores originales. Origen: IM_CONDICION."
      - name: tipo_documento_codigo
        description: "Codigo documental literal. AB y FA son categorias observadas; no justifican por si solos sumar pagos netos. Origen: TIPO_DOC."
      - name: lote_id
        description: "UUID de la captura confirmada seleccionada. No mezclar lotes para sumar obligaciones o movimientos. Origen: LOTE_ID."
        data_tests:
          - not_null
