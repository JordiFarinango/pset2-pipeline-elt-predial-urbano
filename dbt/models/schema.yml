        description: "Saldo consignado en un movimiento. Medida NO aditiva; no sumar saldos entre movimientos. Origen: SALDO."
      - name: fecha_emision_declarada
        description: "Origen IMP_FECHA_EMISION, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_creacion_declarada
        description: "Origen IMP_FECHA_CREA, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_modificacion_declarada
        description: "Origen IMP_FECHA_ULTMODIFIC, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_anulacion_declarada
        description: "Origen IMP_FECHA_ANULACION, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: fecha_proceso_declarada
        description: "Origen FECHA_PROCESO, fecha diaria declarada, no certificada como instante efectivo de negocio. NULL se conserva."
      - name: estado_codigo
        description: "Codigo literal actual. No se convierte automaticamente en pagado, pendiente o etiqueta predictiva. Origen: IMP_ESTADO."
      - name: condicion_codigo
        description: "Codigo literal sin catalogo universal validado; conservar nulos y valores originales. Origen: IMP_CONDICION."
      - name: tipo_movimiento_codigo
        description: "Clasificacion literal del movimiento sin reinterpretacion general. Origen: IMP_TIPO."
      - name: tipo_documento_codigo
        description: "Codigo documental literal. AB y FA son categorias observadas; no justifican por si solos sumar pagos netos. Origen: TIPO_DOC."
      - name: lote_id
        description: "UUID de la captura confirmada seleccionada. No mezclar lotes para sumar obligaciones o movimientos. Origen: LOTE_ID."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('br_lote_confirmado')
                field: lote_id
      - name: capturado_en
        description: "Inicio de captura UTC del ejecutor; no es emision efectiva ni tiempo historico del estado. Origen: CAPTURADO_EN."
        data_tests:
          - not_null
      - name: id_version
        description: "Version del identificador HMAC protegido; no incluye su secreto. Origen: ID_VERSION."
        data_tests:
          - not_null
      - name: dq_fecha_pago_nula
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: fecha_pago_declarada is null"
      - name: dq_pago_anterior_emision
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: coalesce(fecha_pago_declarada < fecha_emision_declarada,false)"
      - name: dq_pago_posterior_captura
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: coalesce(fecha_pago_declarada > to_date(convert_timezone('UTC',capturado_en)),false)"
      - name: dq_fecha_proceso_nula
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: fecha_proceso_declarada is null"
      - name: dq_total_nulo
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: total_movimiento_declarado is null"
      - name: dq_total_negativo
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: coalesce(total_movimiento_declarado < 0,false)"
      - name: dq_a_sin_fecha_anulacion
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: coalesce(estado_codigo='A' and fecha_anulacion_declarada is null,false)"
      - name: dq_f_con_fecha_anulacion
        description: "Indicador de observacion de calidad, no correccion ni filtro. Expresion: coalesce(estado_codigo='F' and fecha_anulacion_declarada is not null,false)"
      - name: contexto_key
        description: "SHA-256 tecnico de combinacion ordenada de origen/codigos con nulos diferenciados. No se aplica a identificadores personales."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contexto_tributario')
                field: contexto_key
      - name: fecha_pago_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: fecha_emision_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: fecha_creacion_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: fecha_modificacion_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: fecha_anulacion_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: fecha_proceso_key
        description: "FK de fecha de rol especifico hacia dim_fecha; 0 si la fecha declarada es NULL."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
