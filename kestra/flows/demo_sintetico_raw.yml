# DEMOSTRACION CON DATOS FICTICIOS. Nunca accede a SQL Server municipal.
id: demo_sintetico_raw
namespace: usfq.pset2
description: 'DEMO SINTETICA: genera obligaciones/pagos ficticios y los carga en Snowflake Raw.'
concurrency:
  limit: 1
  behavior: QUEUE
tasks:
  - id: insertar_obligaciones_ficticias
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://xsdiwiv-xz59673.snowflakecomputing.com
    username: PSET2_PIPELINE_SVC
    privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
    privateKeyPassword: "{{ secret('SNOWFLAKE_PRIVATE_KEY_PASSWORD') }}"
    role: PSET2_PIPELINE_ROLE
    warehouse: COMPUTE_WH
    database: PSET2_DEMO_SINTETICO
    schema: RAW
    sql: |
      MERGE INTO PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES AS t
      USING (
          SELECT
              LOWER(SHA2('PSET2-DEMO-OBL-' || TO_VARCHAR(n),256)) AS OBLIGACION_ID,
              2024::NUMBER(4,0) AS ANIO_FISCAL,
              (100 + n * 10)::NUMBER(16,2) AS IM_PRINCIPAL,
              0::NUMBER(16,2) AS IM_SOLARES,
              0::NUMBER(16,2) AS IM_MEDICINA,
              0::NUMBER(16,2) AS IM_EDUCACION,
              0::NUMBER(16,2) AS IM_MAGISTERIO,
              0::NUMBER(16,2) AS IM_VIVIENDA,
              1.25::NUMBER(16,2) AS IM_BOMBEROS,
              0::NUMBER(16,2) AS IM_ESCOLARES,
              0::NUMBER(16,2) AS IM_PROCESAMIENTO,
              0::NUMBER(16,2) AS IM_BASURA,
              0::NUMBER(16,2) AS IM_BORDILLO,
              0::NUMBER(16,2) AS IM_ALCANTA,
              0::NUMBER(16,2) AS IM_ADOQUI_NUEVO,
              0::NUMBER(16,2) AS IM_ADO_GLOB_2011,
              (101.25 + n * 10)::NUMBER(16,2) AS IM_TOTAL,
              IFF(n=10, NULL::DATE, '2024-01-05'::DATE) AS IM_FECHA_EMISION,
              '2024-01-02'::DATE AS IM_FECHA_CREA,
              '2024-01-09'::DATE AS IM_FECHA_ULTMODIFIC,
              IFF(n IN (1,2,4,6),DATEADD('day',n,'2024-06-20'::DATE),NULL::DATE) AS IM_FECHA_PAGO,
              NULL::DATE AS IM_FECHA_ANULACION,
              'F'::VARCHAR(1) AS IM_ESTADO,
              'N'::VARCHAR(1) AS IM_CONDICION,
              'FA'::VARCHAR(2) AS TIPO_DOC,
              '11111111-2222-4333-8444-555555555555'::VARCHAR(36) AS LOTE_ID,
              TO_TIMESTAMP_TZ('2026-11-15T18:00:00.000+00:00')::TIMESTAMP_TZ(3) AS CAPTURADO_EN,
              'synthetic-v1'::VARCHAR(16) AS ID_VERSION
          FROM (SELECT ROW_NUMBER() OVER (ORDER BY SEQ4()) AS n FROM TABLE(GENERATOR(ROWCOUNT => 10)))
      ) AS s
      ON t.LOTE_ID = s.LOTE_ID AND t.OBLIGACION_ID = s.OBLIGACION_ID
      WHEN NOT MATCHED THEN INSERT (OBLIGACION_ID, ANIO_FISCAL, IM_PRINCIPAL, IM_SOLARES, IM_MEDICINA, IM_EDUCACION, IM_MAGISTERIO, IM_VIVIENDA, IM_BOMBEROS, IM_ESCOLARES, IM_PROCESAMIENTO, IM_BASURA, IM_BORDILLO, IM_ALCANTA, IM_ADOQUI_NUEVO, IM_ADO_GLOB_2011, IM_TOTAL, IM_FECHA_EMISION, IM_FECHA_CREA, IM_FECHA_ULTMODIFIC, IM_FECHA_PAGO, IM_FECHA_ANULACION, IM_ESTADO, IM_CONDICION, TIPO_DOC, LOTE_ID, CAPTURADO_EN, ID_VERSION) VALUES (s.OBLIGACION_ID, s.ANIO_FISCAL, s.IM_PRINCIPAL, s.IM_SOLARES, s.IM_MEDICINA, s.IM_EDUCACION, s.IM_MAGISTERIO, s.IM_VIVIENDA, s.IM_BOMBEROS, s.IM_ESCOLARES, s.IM_PROCESAMIENTO, s.IM_BASURA, s.IM_BORDILLO, s.IM_ALCANTA, s.IM_ADOQUI_NUEVO, s.IM_ADO_GLOB_2011, s.IM_TOTAL, s.IM_FECHA_EMISION, s.IM_FECHA_CREA, s.IM_FECHA_ULTMODIFIC, s.IM_FECHA_PAGO, s.IM_FECHA_ANULACION, s.IM_ESTADO, s.IM_CONDICION, s.TIPO_DOC, s.LOTE_ID, s.CAPTURADO_EN, s.ID_VERSION)
  - id: insertar_movimientos_ficticios
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://xsdiwiv-xz59673.snowflakecomputing.com
    username: PSET2_PIPELINE_SVC
    privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
    privateKeyPassword: "{{ secret('SNOWFLAKE_PRIVATE_KEY_PASSWORD') }}"
    role: PSET2_PIPELINE_ROLE
    warehouse: COMPUTE_WH
    database: PSET2_DEMO_SINTETICO
    schema: RAW
    sql: |
      MERGE INTO PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO AS t
      USING (
          SELECT
              LOWER(SHA2('PSET2-DEMO-MOV-' || TO_VARCHAR(k),256)) AS MOVIMIENTO_ID,
              LOWER(SHA2('PSET2-DEMO-OBL-' || TO_VARCHAR(n),256)) AS OBLIGACION_ID,
              DATEADD('day',k,'2024-06-20'::DATE) AS IMP_FECHA_PAGO,
              (18 + k * 5)::NUMBER(16,2) AS IMP_PRINCIPAL,
              0::NUMBER(16,2) AS IMP_SOLARES,
              0::NUMBER(16,2) AS IMP_MEDICINA,
              0::NUMBER(16,2) AS IMP_EDUCACION,
              0::NUMBER(16,2) AS IMP_MAGISTERIO,
              0::NUMBER(16,2) AS IMP_VIVIENDA,
              0::NUMBER(16,2) AS IMP_BOMBEROS,
              0::NUMBER(16,2) AS IMP_ESCOLARES,
              0::NUMBER(16,2) AS IMP_PROCESAMIENTO,
              0::NUMBER(16,2) AS IMP_BASURA,
              0::NUMBER(16,2) AS IMP_BORDILLO,
              0::NUMBER(16,2) AS IMP_ALCANTA,
              0::NUMBER(16,2) AS IMP_ADOQUI_NUEVO,
              0::NUMBER(16,2) AS IMP_ADO_GLOB_2011,
              (18 + k * 5)::NUMBER(16,2) AS IMP_TOTAL,
              0::NUMBER(16,2) AS IMP_RECARGO,
              0::NUMBER(16,2) AS IMP_DESCUENTO,
              0::NUMBER(16,2) AS IMP_INT_MORA,
              0::NUMBER(16,2) AS COSTA_PROCESAL,
              NULL::NUMBER(16,2) AS SALDO,
              '2024-01-05'::DATE AS IMP_FECHA_EMISION,
              '2024-01-02'::DATE AS IMP_FECHA_CREA,
              DATEADD('day',k,'2024-06-20'::DATE) AS IMP_FECHA_ULTMODIFIC,
              NULL::DATE AS IMP_FECHA_ANULACION,
              DATEADD('day',k,'2024-06-20'::DATE) AS FECHA_PROCESO,
              'F'::VARCHAR(1) AS IMP_ESTADO,
              'N'::VARCHAR(1) AS IMP_CONDICION,
              'A'::VARCHAR(1) AS IMP_TIPO,
              IFF(k IN (1,2,5),'AB','FA')::VARCHAR(2) AS TIPO_DOC,
              '11111111-2222-4333-8444-555555555555'::VARCHAR(36) AS LOTE_ID,
              TO_TIMESTAMP_TZ('2026-11-15T18:00:00.000+00:00')::TIMESTAMP_TZ(3) AS CAPTURADO_EN,
              'synthetic-v1'::VARCHAR(16) AS ID_VERSION
          FROM (SELECT column1 AS k, column2 AS n FROM VALUES (1,1),(2,1),(3,2),(4,4),(5,6),(6,6))
      ) AS s
      ON t.LOTE_ID = s.LOTE_ID AND t.MOVIMIENTO_ID = s.MOVIMIENTO_ID
      WHEN NOT MATCHED THEN INSERT (MOVIMIENTO_ID, OBLIGACION_ID, IMP_FECHA_PAGO, IMP_PRINCIPAL, IMP_SOLARES, IMP_MEDICINA, IMP_EDUCACION, IMP_MAGISTERIO, IMP_VIVIENDA, IMP_BOMBEROS, IMP_ESCOLARES, IMP_PROCESAMIENTO, IMP_BASURA, IMP_BORDILLO, IMP_ALCANTA, IMP_ADOQUI_NUEVO, IMP_ADO_GLOB_2011, IMP_TOTAL, IMP_RECARGO, IMP_DESCUENTO, IMP_INT_MORA, COSTA_PROCESAL, SALDO, IMP_FECHA_EMISION, IMP_FECHA_CREA, IMP_FECHA_ULTMODIFIC, IMP_FECHA_ANULACION, FECHA_PROCESO, IMP_ESTADO, IMP_CONDICION, IMP_TIPO, TIPO_DOC, LOTE_ID, CAPTURADO_EN, ID_VERSION) VALUES (s.MOVIMIENTO_ID, s.OBLIGACION_ID, s.IMP_FECHA_PAGO, s.IMP_PRINCIPAL, s.IMP_SOLARES, s.IMP_MEDICINA, s.IMP_EDUCACION, s.IMP_MAGISTERIO, s.IMP_VIVIENDA, s.IMP_BOMBEROS, s.IMP_ESCOLARES, s.IMP_PROCESAMIENTO, s.IMP_BASURA, s.IMP_BORDILLO, s.IMP_ALCANTA, s.IMP_ADOQUI_NUEVO, s.IMP_ADO_GLOB_2011, s.IMP_TOTAL, s.IMP_RECARGO, s.IMP_DESCUENTO, s.IMP_INT_MORA, s.COSTA_PROCESAL, s.SALDO, s.IMP_FECHA_EMISION, s.IMP_FECHA_CREA, s.IMP_FECHA_ULTMODIFIC, s.IMP_FECHA_ANULACION, s.FECHA_PROCESO, s.IMP_ESTADO, s.IMP_CONDICION, s.IMP_TIPO, s.TIPO_DOC, s.LOTE_ID, s.CAPTURADO_EN, s.ID_VERSION)
  - id: confirmar_lote_sintetico
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://xsdiwiv-xz59673.snowflakecomputing.com
    username: PSET2_PIPELINE_SVC
    privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
    privateKeyPassword: "{{ secret('SNOWFLAKE_PRIVATE_KEY_PASSWORD') }}"
    role: PSET2_PIPELINE_ROLE
    warehouse: COMPUTE_WH
    database: PSET2_DEMO_SINTETICO
    schema: RAW
    sql: |
      MERGE INTO PSET2_DEMO_SINTETICO.RAW.INGESTA_LOTES AS t
      USING (
          SELECT
            '11111111-2222-4333-8444-555555555555'::VARCHAR(36) AS LOTE_ID,
            '2024-01-01'::DATE AS FISCAL_DESDE,
            '2025-01-01'::DATE AS FISCAL_HASTA,
            10::NUMBER(9,0) AS LIMITE,
            TO_TIMESTAMP_TZ('2026-11-15T18:00:00.000+00:00')::TIMESTAMP_TZ(3) AS CAPTURADO_EN,
            'synthetic-v1'::VARCHAR(16) AS ID_VERSION,
            'raw-v1'::VARCHAR(16) AS CONTRATO_VERSION,
            LOWER(SHA2('PUBLIC-SYNTHETIC-KEY-TAG-V1',256)) AS KEY_TAG,
            10::NUMBER(16,0) AS OBLIGACIONES,
            6::NUMBER(16,0) AS MOVIMIENTOS,
            LOWER(SHA2('PSET2-DEMO-CONTRACT-10-6-v1',256)) AS CONTENIDO_SHA256,
            CURRENT_TIMESTAMP()::TIMESTAMP_TZ(3) AS COMMIT_EN
          WHERE
            (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES
             WHERE LOTE_ID='11111111-2222-4333-8444-555555555555')=10
            AND (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO
                 WHERE LOTE_ID='11111111-2222-4333-8444-555555555555')=6
            AND (SELECT COUNT(DISTINCT OBLIGACION_ID)
                 FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES
                 WHERE LOTE_ID='11111111-2222-4333-8444-555555555555')=10
            AND (SELECT COUNT(DISTINCT MOVIMIENTO_ID)
                 FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO
                 WHERE LOTE_ID='11111111-2222-4333-8444-555555555555')=6
            AND NOT EXISTS (
               SELECT 1 FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO p
               WHERE p.LOTE_ID='11111111-2222-4333-8444-555555555555' AND NOT EXISTS (
                 SELECT 1 FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES o
                 WHERE o.LOTE_ID=p.LOTE_ID AND o.OBLIGACION_ID=p.OBLIGACION_ID))
      ) AS s
      ON t.LOTE_ID=s.LOTE_ID
      WHEN NOT MATCHED THEN INSERT (
        LOTE_ID,FISCAL_DESDE,FISCAL_HASTA,LIMITE,CAPTURADO_EN,ID_VERSION,
        CONTRATO_VERSION,KEY_TAG,OBLIGACIONES,MOVIMIENTOS,CONTENIDO_SHA256,COMMIT_EN)
      VALUES (
        s.LOTE_ID,s.FISCAL_DESDE,s.FISCAL_HASTA,s.LIMITE,s.CAPTURADO_EN,s.ID_VERSION,
        s.CONTRATO_VERSION,s.KEY_TAG,s.OBLIGACIONES,s.MOVIMIENTOS,s.CONTENIDO_SHA256,s.COMMIT_EN)
  - id: comprobar_lote_sintetico
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: jdbc:snowflake://xsdiwiv-xz59673.snowflakecomputing.com
    username: PSET2_PIPELINE_SVC
    privateKey: "{{ secret('SNOWFLAKE_PRIVATE_KEY') }}"
    privateKeyPassword: "{{ secret('SNOWFLAKE_PRIVATE_KEY_PASSWORD') }}"
    role: PSET2_PIPELINE_ROLE
    warehouse: COMPUTE_WH
    database: PSET2_DEMO_SINTETICO
    schema: RAW
    fetchType: FETCH_ONE
    sql: |
      SELECT c.*,
        IFF(c.OBLIGACIONES=10 AND c.MOVIMIENTOS=6 AND c.LOTES=1 AND c.HUERFANOS=0,
            'OK','ERROR') AS ESTADO
      FROM (
      SELECT
        (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES
         WHERE LOTE_ID='11111111-2222-4333-8444-555555555555') AS OBLIGACIONES,
        (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO
         WHERE LOTE_ID='11111111-2222-4333-8444-555555555555') AS MOVIMIENTOS,
        (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.INGESTA_LOTES
         WHERE LOTE_ID='11111111-2222-4333-8444-555555555555' AND COMMIT_EN IS NOT NULL) AS LOTES,
        (SELECT COUNT(*) FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_MOVIMIENTOS_PAGO p
         WHERE p.LOTE_ID='11111111-2222-4333-8444-555555555555' AND NOT EXISTS (
           SELECT 1 FROM PSET2_DEMO_SINTETICO.RAW.RAW_URBANO_OBLIGACIONES o
           WHERE o.LOTE_ID=p.LOTE_ID AND o.OBLIGACION_ID=p.OBLIGACION_ID)) AS HUERFANOS
      ) AS c
  - id: exigir_conteos
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.comprobar_lote_sintetico.row.ESTADO == 'OK' }}"
    errorMessage: DEMO_SINTETICA_NO_CONCILIA
